[package]
name = "solaris"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "solaris terminal AI assistant"

[[bin]]
name = "solaris"
path = "src/main.rs"

[dependencies]
solaris-core = { workspace = true }
solaris-provider = { workspace = true }
solaris-backend = { workspace = true }
solaris-tui = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
# Text only: the image and wayland-data-control features would drag in far more
# than a TUI chat client needs.
arboard = { version = "3", default-features = false }

[dev-dependencies]
# The test suites implement `AgentBackend` for their own local fake backend.
async-trait = { workspace = true }
