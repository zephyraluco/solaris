[package]
name = "solaris-backend"
version.workspace = true
edition.workspace = true
rust-version = "1.97.1"
license.workspace = true
description = "Agent backend abstraction and provider clients for solaris"

[lints]
workspace = true

[features]
test-utils = []

[dependencies]
solaris-types = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rig-core.workspace = true
rig-reqwest = { version = "0.46.0", default-features = false, features = ["rustls"] }
# `rustls` rather than the platform TLS stack: no OpenSSL to link on Linux and
# no schannel surprises on Windows. Only the pieces a streaming chat client
# needs — cookie jars, compression, multipart and the blocking client are all
# dead weight here.
reqwest = { version = "0.13", default-features = false, features = [
	"json",
	"stream",
	"rustls",
	"system-proxy",
] }

[dev-dependencies]
solaris-backend = { path = ".", features = ["test-utils"] }
# Only the loopback tests need a listening socket.
tokio = { workspace = true, features = ["net"] }
