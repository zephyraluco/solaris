[package]
name = "solaris-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Built-in tools for solaris"

[lints]
workspace = true

[dependencies]
base64 = "0.22"
serde = { workspace = true }
solaris-types = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# `process` and `io-util` are for the shell tools, `fs` for the file tools.
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
tempfile = "3"
similar = "2"

[target.'cfg(unix)'.dependencies]
# Signalling a command's whole process group needs the call itself on Unix; the
# child is put in a group of its own so the negated pid reaches its descendants.
libc = { workspace = true }
