[package]
name = "solaris-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Provider catalogue, credentials and platform resolution for solaris"

[lints]
workspace = true

[dependencies]
rig-core.workspace = true
rig-reqwest = { version = "0.46.0", default-features = false, features = ["rustls"] }
solaris-types = { workspace = true }
tempfile = "3"
solaris-backend = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy", "form"] }
sha2 = "0.10"

[dev-dependencies]
solaris-agent = { workspace = true, features = ["test-utils"] }
solaris-backend = { workspace = true, features = ["test-utils"] }
base64 = "0.22"
url = "2"
rig-core = { workspace = true, features = ["test-utils"] }
futures = { workspace = true }
# The resolution tests drive the async entry point.
tokio = { workspace = true }
