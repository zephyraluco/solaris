[package]
name = "solaris-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Provider catalogue, credentials and platform resolution for solaris"

[lints]
workspace = true

[dependencies]
solaris-types = { workspace = true }
tempfile = "3"
solaris-backend = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy", "form"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
url = "2"

[dev-dependencies]
# The resolution tests drive the async entry point.
tokio = { workspace = true }
