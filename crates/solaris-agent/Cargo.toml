[package]
name = "solaris-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The agent session for solaris: tools declared to a model and run for it"

[lints]
workspace = true

[dependencies]
solaris-backend = { workspace = true }
solaris-provider = { workspace = true }
solaris-tools = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The unit tests build tool-call arguments, and the loopback test binds a real
# socket and drives the real HTTP client.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
