[package]
name = "solaris-agent"
version.workspace = true
edition.workspace = true
rust-version = "1.97.1"
license.workspace = true
description = "The agent session for solaris: tools declared to a model and run for it"

[lints]
workspace = true

[features]
test-utils = ["solaris-backend/test-utils"]

[dependencies]
rig-agent.workspace = true
rig-memory = { version = "0.46.0", features = ["fs"] }
rig-core.workspace = true
solaris-backend = { workspace = true }
solaris-tools = { workspace = true }
solaris-types.workspace = true
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
sha2 = "0.10"
jsonschema = { version = "0.33", default-features = false }

[dev-dependencies]
solaris-agent = { path = ".", features = ["test-utils"] }
solaris-backend = { workspace = true, features = ["test-utils"] }
rig-core = { workspace = true, features = ["test-utils"] }
tempfile = "3"
# The unit tests build tool-call arguments, and the loopback test binds a real
# socket and drives the real HTTP client.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }
