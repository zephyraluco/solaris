[package]
name = "solaris-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The agent session for solaris: tools declared to a model and run for it"

[lints]
workspace = true

[dependencies]
solaris-backend = { workspace = true }
solaris-provider = { workspace = true }
solaris-tools = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
jsonschema = { version = "0.33", default-features = false }

[dev-dependencies]
# The unit tests build tool-call arguments, and the loopback test binds a real
# socket and drives the real HTTP client.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }
