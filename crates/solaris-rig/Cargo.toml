[package]
name = "solaris-rig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rig model transport adapter for Solaris"

[lints]
workspace = true

[dependencies]
solaris-backend.workspace = true
rig-core.workspace = true
rig-reqwest = { version = "0.46.0", default-features = false, features = ["rustls"] }
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "system-proxy"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
