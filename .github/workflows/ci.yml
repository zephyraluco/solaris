name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: cargo build -p solaris --release --locked
      - if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: solaris-${{ runner.os }}
          path: target/release/solaris
          if-no-files-found: error
      - if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: solaris-${{ runner.os }}
          path: target/release/solaris.exe
          if-no-files-found: error
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo +1.88.0 check --workspace --all-targets --all-features --locked
